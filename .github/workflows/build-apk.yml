name: Build Altabuki Pay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python
        run: |
          python -m py_compile main.py
          find screens owner admin services -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile

      - name: Build APK
        run: |
          flet build apk --build-number ${{ github.run_number }}

      - name: Find APK
        run: |
          echo "===== APK files ====="
          find build -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: altabuki-pay-apk
          path: build/**/*.apk
          if-no-files-found: error
